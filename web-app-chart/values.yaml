replicaCount: 3

image:
  repository: nginx
  tag: "1.27"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

environment: development

config:
  appEnv: development
  appMessage: "Hello from Helm on GKE"

serviceAccount:
  create: true
  name: web-app
