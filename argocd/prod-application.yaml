apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/TheLawal24/kubernetes-gitops-platform.git
    targetRevision: main
    path: web-app-chart

    helm:
      releaseName: prod-release
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
