name: Application CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: pytest -v

  build-and-scan:
    name: Build and Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t gitops-app:${GITHUB_SHA} \
            ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gitops-app:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  publish:
    name: Publish and Update GitOps
    runs-on: ubuntu-latest
    needs: build-and-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISH_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            ${{ vars.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      - name: Build immutable image
        env:
          IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.APP_IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build \
            -t "${IMAGE}" \
            ./app

      - name: Push immutable image
        env:
          IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.APP_IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker push "${IMAGE}"

      - name: Update Dev GitOps image tag
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("web-app-chart/values-dev.yaml")
          text = path.read_text()

          sha = os.environ["IMAGE_SHA"]

          lines = text.splitlines()
          output = []
          inside_image = False
          changed = False

          for line in lines:
              if line == "image:":
                  inside_image = True
                  output.append(line)
                  continue

              if inside_image and line.startswith("  tag:"):
                  new_line = f'  tag: "{sha}"'
                  if line != new_line:
                      changed = True
                  output.append(new_line)
                  continue

              if inside_image and line and not line.startswith("  "):
                  inside_image = False

              output.append(line)

          if not changed:
              print("Image tag already matches this commit.")
          else:
              path.write_text("\n".join(output) + "\n")
              print(f"Updated Dev image tag to {sha}")
          PY

      - name: Show GitOps change
        run: |
          git diff -- web-app-chart/values-dev.yaml

      - name: Commit GitOps image update
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet -- web-app-chart/values-dev.yaml; then
            echo "No GitOps update required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web-app-chart/values-dev.yaml

          git commit \
            -m "Deploy ${IMAGE_SHA} to dev [skip ci]"

          git push origin HEAD:main

      - name: Job summary
        env:
          IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.APP_IMAGE_NAME }}:${{ github.sha }}
        run: |
          echo "## GitOps deployment" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published immutable image:" >> "${GITHUB_STEP_SUMMARY}"
          echo '```text' >> "${GITHUB_STEP_SUMMARY}"
          echo "${IMAGE}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Updated web-app-chart/values-dev.yaml." >> "${GITHUB_STEP_SUMMARY}"
          echo "Argo CD will reconcile the new desired state automatically." >> "${GITHUB_STEP_SUMMARY}"
